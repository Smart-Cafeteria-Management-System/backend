# ============================================================
# Smart Cafeteria Backend — CI/CD Pipeline
# Triggers on push and pull requests to main branch
# Steps: Checkout → Setup Go → Install Deps → Vet → Test → Build
# ============================================================

name: Backend CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    name: Build, Test & Verify
    runs-on: ubuntu-latest

    steps:
      # 1. Checkout source code
      - name: Checkout code
        uses: actions/checkout@v4

      # 2. Setup Go environment
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      # 3. Cache Go modules for faster builds
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: ${{ runner.os }}-go-${{ hashFiles('go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      # 4. Download dependencies
      - name: Download dependencies
        run: go mod download

      # 5. Verify dependencies
      - name: Verify dependencies
        run: go mod verify

      # 6. Run go vet (static analysis)
      - name: Run go vet
        run: go vet ./...

      # 7. Run tests
      - name: Test
        run: go test ./... -v

      # 8. Build the application
      - name: Build
        run: go build -v ./cmd/server/

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t smart-cafeteria-backend .
